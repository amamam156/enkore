<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- The above 3 meta tags *must* be placed first, and any other content *must* follow them! -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
    <title>Enkore Karaoke</title>
    <link rel="icon" href="./../images/favico.ico">
    <!--Root font settings for different screen sizes-->
    <script src="./../js/base.js"></script>
    <!--element-ui style-->
    <link rel="stylesheet" href="../../backend/plugins/element-ui/index.css"/>
    <!--Introducing vant style-->
    <link rel="stylesheet" href="../styles/vant.min.css"/>
    <!--Introduce styles -->
    <link rel="stylesheet" href="../styles/index.css"/>
    <!--The style of the content of this Page-->
    <link rel="stylesheet" href="./../styles/login.css"/>
</head>
<body>
<div id="login" v-loading="loading">
    <div class="divHead">Login</div>
    <div class="logo-container"> <
        <img src="/front/images/logo.png" alt="Logo">
    </div>
    <div class="divContainer">
        <el-input placeholder=" Please enter email" v-model="form.email" maxlength='30'/>
        </el-input>
        <div class="divSplit"></div>
        <el-input placeholder=" Please enter Verification code" v-model="form.code" maxlength='20'/>
        </el-input>
        <span @click='getCode'>Send code</span>
    </div>
    <div class="divMsg" v-if="msgFlag">Email is incorrect.</div>
    <el-button type="primary" :class="{btnSubmit:1===1,btnNoEmail:!form.email,btnEmail:form.email}" @click="btnLogin">
        Login
    </el-button>
    <div v-if="testCode" style="text-align: center; margin-top: 10px; color: green; font-size: 24px; font-weight: bold;">
        Test code: {{ testCode }}
    </div>
</div>
<!-- Development environment version, including helpful command line warnings -->
<script src="../../backend/plugins/vue/vue.js"></script>
<!-- Import component library -->
<script src="../../backend/plugins/element-ui/index.js"></script>
<!-- Introduce vant style -->
<script src="./../js/vant.min.js"></script>
<!-- Introduce axios -->
<script src="../../backend/plugins/axios/axios.min.js"></script>
<script src="./../js/request.js"></script>
<script src="./../api/login.js"></script>
</body>
<script>
    new Vue({
        el: "#login",
        data() {
            return {
                form: {
                    email: '',
                    code: ''
                },
                msgFlag: false,
                loading: false,
                testCode: '' // Added for displaying test code
            }
        },
        computed: {},
        created() {
        },
        mounted() {
        },
        methods: {
            getCode() {
                this.form.code = ''
                const regex = /^\w+([-+.]\w+)*@\w+([-.]\w+)*\.\w+([-.]\w+)*$/;
                if (regex.test(this.form.email)) {
                    this.msgFlag = false
                    // For testing purposes, simulate code generation
                    // const simulatedCode = (Math.random()*1000000).toFixed(0); // No longer needed
                    // this.testCode = simulatedCode; // No longer needed
                    // this.form.code = simulatedCode; // No longer needed
                    sendMsgApi({email: this.form.email}).then(res => {
                        if (res.code === 1) { // Assuming res.code === 1 means success
                            this.testCode = res.data; // Get the actual code from backend response
                            this.form.code = res.data; // Set the form's code to the actual code
                            console.log('Verification code sent:', res.data);
                        } else {
                            this.$notify({type: 'warning', message: res.msg});
                        }
                    }).catch(error => {
                        console.error('Error sending verification code:', error);
                    });
                } else {
                    this.msgFlag = true
                }
            },
            async btnLogin() {
                if (this.form.email && this.form.code) {
                    this.loading = true
                    const res = await loginApi(this.form)
                    this.loading = false
                    if (res.code === 1) {
                        sessionStorage.setItem("userEmail", this.form.email)
                        window.requestAnimationFrame(() => {
                            window.location.href = '/front/index.html'
                        })
                    } else {
                        this.$notify({type: 'warning', message: res.msg});
                    }
                } else {
                    this.$notify({type: 'warning', message: 'Please enter email'});
                }
            }
        }
    })
</script>
</html>
